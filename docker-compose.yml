# الواجهة وحدها على المنفذ 5001 (nginx) — تُفتح من المتصفح على http://163.245.221.210:5001
# تمرّر /api إلى الباك اند عبر API_UPSTREAM — منفذ 5000 على نفس الخادم (host.docker.internal)،
# فتصل الطلبات من نفس الأصل بلا CORS. إن نُقل الباك اند إلى جهاز آخر: API_UPSTREAM=IP:5000
#   التشغيل:  docker compose up -d --build
#   السجلات:  docker compose logs -f
services:
  client:
    build: .
    image: wafeer-dashboard-client
    container_name: wafeer-dashboard-client
    restart: unless-stopped
    environment:
      API_UPSTREAM: host.docker.internal:5000
    ports:
      - "5001:5001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
